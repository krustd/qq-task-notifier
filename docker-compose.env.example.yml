# 复制为 docker-compose.env.yml 后使用。
# Docker Compose 会读取同目录 .env，并以此覆盖基础 Compose 文件的凭据占位符。
services:
  qq-task-notifier:
    environment:
      QQBOT_APP_ID: ${QQBOT_APP_ID:?请在 .env 中设置 QQBOT_APP_ID}
      QQBOT_APP_SECRET: ${QQBOT_APP_SECRET:?请在 .env 中设置 QQBOT_APP_SECRET}
      QQBOT_API_TOKEN: ${QQBOT_API_TOKEN:?请在 .env 中设置 QQBOT_API_TOKEN}
