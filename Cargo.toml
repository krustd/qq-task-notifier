[package]
name = "qq-task-notifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "QQ Bot WebSocket connector and task-completion notifier"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "multipart"] }
futures-util = "0.3"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
