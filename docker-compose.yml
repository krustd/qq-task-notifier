services:
  qq-task-notifier:
    image: qq-task-notifier:latest
    restart: unless-stopped
    environment:
      QQBOT_APP_ID: "请填写 QQ 机器人 App ID"
      QQBOT_APP_SECRET: "请填写 QQ 机器人 App Secret"
      QQBOT_API_TOKEN: "请填写至少 32 个字符的随机 Token"
      QQBOT_HTTP_HOST: "0.0.0.0"
      QQBOT_HTTP_PORT: "8765"
    ports:
      - "8765:8765"
    volumes:
      - qqbot-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  qqbot-data:
